<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>All Bugs</title>

<link
    rel="stylesheet"
    href="css/style.css">

</head>

<body>

<div class="dashboard-container">

<aside class="sidebar">

<h2>🐞 Bug Tracker</h2>

<nav>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="add-bug.html">➕ Add Bug</a>

<a href="bugs.html" class="active">
📋 All Bugs
</a>

<a href="search-bug.html">🔍 Search Bug</a>

<a href="developers.html">👨‍💻 Developers</a>

<a href="statistics.html">📊 Statistics</a>

<a href="comments.html">💬 Comments</a>

<a href="history.html">🕘 History</a>

<a href="reports.html">📄 Reports</a>

</nav>

<button onclick="logout()">🚪 Logout</button>

</aside>


<main class="main-content">

<header class="top-header">

<div>

<h1>All Bugs</h1>

<p>View all registered bugs</p>

</div>

<button
    class="action-button"
    onclick="loadBugs()">

Refresh

</button>

</header>


<div class="table-container">

<table>

<thead>

<tr>

<th>ID</th>

<th>Title</th>

<th>Description</th>

<th>Priority</th>

<th>Status</th>

<th>Reported By</th>

<th>Developer</th>

</tr>

</thead>

<tbody id="bugTable">

</tbody>

</table>

</div>

</main>

</div>


<script>

function escapeHTML(value) {

return String(value ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


async function loadBugs() {

const table =
    document.getElementById("bugTable");


table.innerHTML =
    "<tr><td colspan='7'>Loading...</td></tr>";


try {

const response =
    await fetch(
        "https://bugtrackingwebsite-production.up.railway.app/api/bugs"
    );


const bugs =
    await response.json();


if (bugs.length === 0) {

table.innerHTML =
    "<tr><td colspan='7'>No bugs found</td></tr>";

return;

}


table.innerHTML =
    bugs.map(bug => `

<tr>

<td>${escapeHTML(bug.id)}</td>

<td>${escapeHTML(bug.title)}</td>

<td>${escapeHTML(bug.description)}</td>

<td>${escapeHTML(bug.priority)}</td>

<td>${escapeHTML(bug.status)}</td>

<td>${escapeHTML(bug.reportedBy)}</td>

<td>${escapeHTML(bug.assignedDeveloper || "-")}</td>

</tr>

`).join("");


} catch(error) {

table.innerHTML =
    `<tr>
        <td colspan="7">
            Unable to connect to backend
        </td>
    </tr>`;

}

}


function logout() {

localStorage.clear();

window.location.href =
    "login.html";

}


loadBugs();

</script>

</body>
</html>
