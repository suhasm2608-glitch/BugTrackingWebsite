<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Bug History</title>

<link
    rel="stylesheet"
    href="css/style.css">

</head>

<body>

<div class="dashboard-container">

<aside class="sidebar">

<h2>🐞 Bug Tracker</h2>

<nav>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="add-bug.html">➕ Add Bug</a>

<a href="bugs.html">📋 All Bugs</a>

<a href="search-bug.html">🔍 Search Bug</a>

<a href="developers.html">👨‍💻 Developers</a>

<a href="statistics.html">📊 Statistics</a>

<a href="comments.html">💬 Comments</a>

<a href="history.html" class="active">
🕘 History
</a>

<a href="reports.html">📄 Reports</a>

</nav>

<button onclick="logout()">🚪 Logout</button>

</aside>


<main class="main-content">

<header class="top-header">

<div>

<h1>Bug History</h1>

<p>View bug activity history</p>

</div>

<button
    class="action-button"
    onclick="loadHistory()">

Refresh

</button>

</header>


<div class="table-container">

<table>

<thead>

<tr>

<th>ID</th>

<th>Bug ID</th>

<th>Action</th>

<th>Performed By</th>

<th>Timestamp</th>

</tr>

</thead>

<tbody id="historyTable">

</tbody>

</table>

</div>

</main>

</div>


<script>

function escapeHTML(value) {

return String(value ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


async function loadHistory() {

const table =
    document.getElementById(
        "historyTable"
    );


try {

const response =
    await fetch(
        "https://bugtrackingwebsite-production.up.railway.app/api/history"
    );


const history =
    await response.json();


if (history.length === 0) {

table.innerHTML =
`
<tr>

<td colspan="5">

No history records found.

</td>

</tr>
`;

return;

}


table.innerHTML =
history.map(item => `

<tr>

<td>
${escapeHTML(item.id)}
</td>

<td>
${escapeHTML(item.bugId)}
</td>

<td>
${escapeHTML(item.action)}
</td>

<td>
${escapeHTML(item.performedBy)}
</td>

<td>
${escapeHTML(item.timestamp)}
</td>

</tr>

`).join("");


} catch(error) {

table.innerHTML =
`
<tr>

<td colspan="5">

Unable to load history.

</td>

</tr>
`;

}

}


function logout() {

localStorage.clear();

window.location.href =
    "login.html";

}


loadHistory();

</script>

</body>
</html>
