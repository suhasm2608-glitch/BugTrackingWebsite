<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Bug</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>🐞 Bug Tracker</h2>

        <nav>

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="add-bug.html" class="active">
                ➕ Add Bug
            </a>

            <a href="bugs.html">
                📋 All Bugs
            </a>

            <a href="search-bug.html">
                🔍 Search Bug
            </a>

            <a href="developers.html">
                👨‍💻 Developers
            </a>

            <a href="statistics.html">
                📊 Statistics
            </a>

            <a href="comments.html">
                💬 Comments
            </a>

            <a href="history.html">
                🕘 History
            </a>

            <a href="reports.html">
                📄 Reports
            </a>

        </nav>

        <button onclick="logout()">
            🚪 Logout
        </button>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="top-header">

            <div>

                <h1>Add New Bug</h1>

                <p>
                    Report a new software issue
                </p>

            </div>

        </header>


        <!-- FORM -->
        <div class="form-card">

            <form id="bugForm">

                <!-- BUG TITLE -->
                <div class="form-group">

                    <label for="title">
                        Bug Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                        placeholder="Enter bug title"
                    >

                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        required
                        placeholder="Describe the bug"
                    ></textarea>

                </div>


                <!-- PRIORITY + STATUS -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="priority">
                            Priority
                        </label>

                        <select id="priority" required>

                            <option value="">
                                Select Priority
                            </option>

                            <option value="LOW">
                                Low
                            </option>

                            <option value="MEDIUM">
                                Medium
                            </option>

                            <option value="HIGH">
                                High
                            </option>

                            <option value="CRITICAL">
                                Critical
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select id="status">

                            <option value="OPEN">
                                Open
                            </option>

                            <option value="IN_PROGRESS">
                                In Progress
                            </option>

                            <option value="RESOLVED">
                                Resolved
                            </option>

                            <option value="CLOSED">
                                Closed
                            </option>

                        </select>

                    </div>

                </div>


                <!-- REPORTED BY + DEVELOPER -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="reportedBy">
                            Reported By
                        </label>

                        <input
                            type="text"
                            id="reportedBy"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="assignedDeveloper">
                            Assigned Developer
                        </label>

                        <input
                            type="text"
                            id="assignedDeveloper"
                            placeholder="Enter developer"
                        >

                    </div>

                </div>


                <!-- BUTTONS -->
                <div class="button-row">

                    <button
                        type="submit"
                        class="save-button"
                        id="saveButton"
                    >
                        Save Bug
                    </button>


                    <button
                        type="button"
                        class="cancel-button"
                        onclick="window.location.href='dashboard.html'"
                    >
                        Cancel
                    </button>

                </div>


                <!-- MESSAGE -->
                <div
                    id="message"
                    class="message"
                ></div>

            </form>

        </div>

    </main>

</div>


<script>

    /*
     * =====================================================
     * RAILWAY BACKEND
     * =====================================================
     */

    const API_BASE_URL =
        "https://bugtrackingwebsite-production.up.railway.app";


    /*
     * =====================================================
     * GET LOGGED-IN USER
     * =====================================================
     */

    const username =
        localStorage.getItem("username");


    document.getElementById("reportedBy").value =
        username || "";


    /*
     * =====================================================
     * BUG FORM
     * =====================================================
     */

    document
        .getElementById("bugForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const message =
                document.getElementById("message");

            const saveButton =
                document.getElementById("saveButton");


            /*
             * Clear previous message
             */

            message.textContent = "";

            message.style.display = "none";


            /*
             * Get form values
             */

            const bug = {

                title:
                    document
                    .getElementById("title")
                    .value
                    .trim(),

                description:
                    document
                    .getElementById("description")
                    .value
                    .trim(),

                priority:
                    document
                    .getElementById("priority")
                    .value,

                status:
                    document
                    .getElementById("status")
                    .value,

                reportedBy:
                    document
                    .getElementById("reportedBy")
                    .value
                    .trim(),

                assignedDeveloper:
                    document
                    .getElementById("assignedDeveloper")
                    .value
                    .trim()

            };


            /*
             * Basic validation
             */

            if (!bug.title) {

                showError(
                    "Please enter the bug title."
                );

                return;
            }


            if (!bug.description) {

                showError(
                    "Please enter the bug description."
                );

                return;
            }


            if (!bug.priority) {

                showError(
                    "Please select a priority."
                );

                return;
            }


            if (!bug.reportedBy) {

                showError(
                    "Reported By field is required."
                );

                return;
            }


            /*
             * Disable button
             */

            saveButton.disabled = true;

            saveButton.textContent =
                "Saving...";


            try {

                /*
                 * IMPORTANT:
                 * This is now Railway,
                 * NOT localhost.
                 */

                const response =
                    await fetch(
                        API_BASE_URL + "/api/bugs",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(bug)

                        }
                    );


                /*
                 * Try to read response
                 */

                let data = null;

                try {

                    data =
                        await response.json();

                } catch (jsonError) {

                    console.log(
                        "Response was not JSON."
                    );

                }


                /*
                 * Check response
                 */

                if (!response.ok) {

                    let errorMessage =
                        "Unable to save bug.";

                    if (data) {

                        if (data.message) {

                            errorMessage =
                                data.message;

                        } else if (data.error) {

                            errorMessage =
                                data.error;

                        }

                    }

                    throw new Error(
                        errorMessage
                    );
                }


                /*
                 * SUCCESS
                 */

                message.style.display =
                    "block";

                message.className =
                    "message success";

                message.textContent =
                    "Bug added successfully!";


                /*
                 * Reset form
                 */

                document
                    .getElementById("bugForm")
                    .reset();


                /*
                 * Put username back
                 */

                document
                    .getElementById("reportedBy")
                    .value =
                    username || "";


            } catch (error) {

                console.error(
                    "Add Bug Error:",
                    error
                );


                message.style.display =
                    "block";

                message.className =
                    "message error";


                /*
                 * Display useful error
                 */

                if (
                    error.message ===
                    "Failed to fetch"
                ) {

                    message.textContent =
                        "Failed to fetch. Please check the Railway backend connection.";

                } else {

                    message.textContent =
                        error.message;

                }

            } finally {

                /*
                 * Enable button again
                 */

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Save Bug";

            }

        });


    /*
     * =====================================================
     * SHOW ERROR
     * =====================================================
     */

    function showError(text) {

        const message =
            document.getElementById("message");

        message.style.display =
            "block";

        message.className =
            "message error";

        message.textContent =
            text;

    }


    /*
     * =====================================================
     * LOGOUT
     * =====================================================
     */

    function logout() {

        localStorage.clear();

        window.location.href =
            "login.html";

    }

</script>

</body>

</html>
