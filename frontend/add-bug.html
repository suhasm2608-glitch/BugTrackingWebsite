<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Add Bug</title>

<link
    rel="stylesheet"
    href="css/style.css">

</head>

<body>

<div class="dashboard-container">

<aside class="sidebar">

<h2>🐞 Bug Tracker</h2>

<nav>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="add-bug.html" class="active">
➕ Add Bug
</a>

<a href="bugs.html">📋 All Bugs</a>

<a href="search-bug.html">🔍 Search Bug</a>

<a href="developers.html">👨‍💻 Developers</a>

<a href="statistics.html">📊 Statistics</a>

<a href="comments.html">💬 Comments</a>

<a href="history.html">🕘 History</a>

<a href="reports.html">📄 Reports</a>

</nav>

<button onclick="logout()">🚪 Logout</button>

</aside>


<main class="main-content">

<header class="top-header">

<div>

<h1>Add New Bug</h1>

<p>Report a new software issue</p>

</div>

</header>


<div class="form-card">

<form id="bugForm">

<div class="form-group">

<label>Bug Title</label>

<input
    type="text"
    id="title"
    required
    placeholder="Enter bug title">

</div>


<div class="form-group">

<label>Description</label>

<textarea
    id="description"
    required
    placeholder="Describe the bug">
</textarea>

</div>


<div class="form-row">

<div class="form-group">

<label>Priority</label>

<select id="priority" required>

<option value="">Select Priority</option>

<option value="LOW">Low</option>

<option value="MEDIUM">Medium</option>

<option value="HIGH">High</option>

<option value="CRITICAL">Critical</option>

</select>

</div>


<div class="form-group">

<label>Status</label>

<select id="status">

<option value="OPEN">Open</option>

<option value="IN_PROGRESS">
In Progress
</option>

<option value="RESOLVED">
Resolved
</option>

<option value="CLOSED">
Closed
</option>

</select>

</div>

</div>


<div class="form-row">

<div class="form-group">

<label>Reported By</label>

<input
    type="text"
    id="reportedBy"
    required>

</div>


<div class="form-group">

<label>Assigned Developer</label>

<input
    type="text"
    id="assignedDeveloper"
    placeholder="Enter developer">

</div>

</div>


<div class="button-row">

<button
    type="submit"
    class="save-button">

    Save Bug

</button>

<button
    type="button"
    class="cancel-button"
    onclick="window.location.href='dashboard.html'">

    Cancel

</button>

</div>


<div
    id="message"
    class="message">
</div>

</form>

</div>

</main>

</div>


<script>

const username =
    localStorage.getItem("username");


document.getElementById("reportedBy").value =
    username || "";


document
.getElementById("bugForm")
.addEventListener("submit", async function(event) {

event.preventDefault();


const bug = {

title:
    document.getElementById("title").value,

description:
    document.getElementById("description").value,

priority:
    document.getElementById("priority").value,

status:
    document.getElementById("status").value,

reportedBy:
    document.getElementById("reportedBy").value,

assignedDeveloper:
    document.getElementById("assignedDeveloper").value

};


const message =
    document.getElementById("message");


try {

const response =
    await fetch(
        "http://localhost:8080/api/bugs",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(bug)
        }
    );


if (!response.ok) {

throw new Error(
    "Unable to save bug"
);

}


message.style.display = "block";

message.className =
    "message success";

message.textContent =
    "Bug added successfully!";


document.getElementById("bugForm").reset();

document.getElementById("reportedBy").value =
    username || "";


} catch(error) {

message.style.display = "block";

message.className =
    "message error";

message.textContent =
    error.message;

}

});


function logout() {

localStorage.clear();

window.location.href =
    "login.html";

}

</script>

</body>
</html>
