<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Bug Reports</title>

<link
    rel="stylesheet"
    href="css/style.css">

<style>

@media print {

.sidebar,
.top-header button {
    display: none;
}

.main-content {
    margin-left: 0;
    width: 100%;
}

}

</style>

</head>

<body>

<div class="dashboard-container">

<aside class="sidebar">

<h2>🐞 Bug Tracker</h2>

<nav>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="add-bug.html">➕ Add Bug</a>

<a href="bugs.html">📋 All Bugs</a>

<a href="search-bug.html">🔍 Search Bug</a>

<a href="developers.html">👨‍💻 Developers</a>

<a href="statistics.html">📊 Statistics</a>

<a href="comments.html">💬 Comments</a>

<a href="history.html">🕘 History</a>

<a href="reports.html" class="active">
📄 Reports
</a>

</nav>

<button onclick="logout()">🚪 Logout</button>

</aside>


<main class="main-content">

<header class="top-header">

<div>

<h1>Bug Reports</h1>

<p>Generate and print bug reports</p>

</div>

<div>

<button
    class="action-button"
    onclick="loadReport()">

Refresh

</button>

<button
    class="action-button"
    onclick="window.print()">

Print

</button>

</div>

</header>


<div class="table-container">

<h2>Bug Report</h2>

<br>

<table>

<thead>

<tr>

<th>ID</th>

<th>Title</th>

<th>Priority</th>

<th>Status</th>

<th>Reported By</th>

<th>Developer</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

</div>

</main>

</div>


<script>

function escapeHTML(value) {

return String(value ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


async function loadReport() {

const table =
    document.getElementById(
        "reportTable"
    );


try {

const response =
    await fetch(
        "http://localhost:8080/api/bugs"
    );


const bugs =
    await response.json();


if (bugs.length === 0) {

table.innerHTML =
`
<tr>

<td colspan="6">

No bugs available.

</td>

</tr>
`;

return;

}


table.innerHTML =
bugs.map(bug => `

<tr>

<td>
${escapeHTML(bug.id)}
</td>

<td>
${escapeHTML(bug.title)}
</td>

<td>
${escapeHTML(bug.priority)}
</td>

<td>
${escapeHTML(bug.status)}
</td>

<td>
${escapeHTML(bug.reportedBy)}
</td>

<td>
${escapeHTML(bug.assignedDeveloper || "-")}
</td>

</tr>

`).join("");


} catch(error) {

table.innerHTML =
`
<tr>

<td colspan="6">

Unable to load report.

</td>

</tr>
`;

}

}


function logout() {

localStorage.clear();

window.location.href =
    "login.html";

}


loadReport();

</script>

</body>
</html>
